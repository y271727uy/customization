<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p class="site-description">{{ site.description }}</p>

        <nav class="file-tree" aria-label="站点目录">
          <a class="tree-page" href="{{ '/' | relative_url }}">首页</a>

          <details class="tree-folder" open>
            <summary>分页 1：概述</summary>
            <a href="{{ '/pages/overview/' | relative_url }}">概述首页</a>
            <a href="{{ '/pages/overview/what-is-customization/' | relative_url }}">章节 1：什么是魔改</a>
            <a href="{{ '/pages/overview/common-tools/' | relative_url }}">章节 2：常见魔改工具</a>
          </details>

          <details class="tree-folder" open>
            <summary>分页 2：实战</summary>
            <a href="{{ '/pages/practice/' | relative_url }}">实战首页</a>
            <a href="{{ '/pages/practice/script-structure/' | relative_url }}">章节 1：脚本结构</a>
            <a href="{{ '/pages/practice/recipe-editing/' | relative_url }}">章节 2：常见配方修改</a>
          </details>

          <details class="tree-folder" open>
            <summary>分页 3：开发</summary>
            <a href="{{ '/pages/development/' | relative_url }}">开发首页</a>
            <a href="{{ '/pages/development/environment/' | relative_url }}">章节 1：开发环境</a>
            <a href="{{ '/pages/development/debug-release/' | relative_url }}">章节 2：调试与发布</a>
          </details>
        </nav>
      </aside>

      <div class="content-shell">
        <main class="page">
          {{ content }}
        </main>

        <footer class="site-footer">
          <span>{{ site.description }}</span>
        </footer>
      </div>
    </div>
  </body>
</html>
